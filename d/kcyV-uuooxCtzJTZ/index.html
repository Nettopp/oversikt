<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let valgtSted = 0, valgtDag = 0;

document.getElementById('oppdatert').textContent = 'Oppdatert ' + D.oppdatert;

/* ---- vindgraf: SVG tegnet fra data, med terskellinje og vindkast ---- */
function tegnGraf(timer){
  const B=780,H=190,mv=30,mh=26,bh=H-mh-14,bb=B-mv-10;
  const maks=Math.max(12,...timer.map(t=>t.kast))*1.05;
  const x=i=>mv+(bb*i)/Math.max(1,timer.length-1), y=v=>14+bh-(v/maks)*bh;
  let s=`<svg class="graf" viewBox="0 0 ${B} ${H}" preserveAspectRatio="none" role="img">`;
  for(let g=0; g<=maks; g+=4){
    s+=`<line x1="${mv}" y1="${y(g)}" x2="${B-10}" y2="${y(g)}" stroke="var(--kant)" stroke-width="1"/>`;
    s+=`<text x="4" y="${y(g)+4}" font-size="11" fill="var(--svak)">${g}</text>`;
  }
  const terskel=y(D.terskel);
  s+=`<line x1="${mv}" y1="${terskel}" x2="${B-10}" y2="${terskel}" stroke="var(--gronn)"
       stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<text x="${B-14}" y="${terskel-5}" font-size="11" fill="var(--gronn)" text-anchor="end">wingfoil ${D.terskel} m/s</text>`;
  const omr=timer.map((t,i)=>`${x(i)},${y(t.kast)}`).join(' ')
    +' '+timer.map((t,i)=>`${x(timer.length-1-i)},${y(timer[timer.length-1-i].vind)}`).join(' ');
  s+=`<polygon points="${omr}" fill="var(--bla)" opacity=".14"/>`;
  s+=`<polyline points="${timer.map((t,i)=>`${x(i)},${y(t.vind)}`).join(' ')}"
       fill="none" stroke="var(--bla)" stroke-width="2.5" stroke-linejoin="round"/>`;
  timer.forEach((t,i)=>{
    if(t.t%3===0) s+=`<text x="${x(i)}" y="${H-8}" font-size="11" fill="var(--svak)" text-anchor="middle">${t.t}</text>`;
    s+=`<circle cx="${x(i)}" cy="${y(t.vind)}" r="10" fill="transparent" data-i="${i}"/>`;
  });
  return s+'</svg>';
}

function vindu(timer){
  let best=null,cur=[];
  for(const t of timer){
    if(t.vind>=D.terskel) cur.push(t);
    else { if(cur.length>=2 && (!best||cur.length>best.length)) best=cur; cur=[]; }
  }
  if(cur.length>=2 && (!best||cur.length>best.length)) best=cur;
  return best;
}

function tegn(){
  const st=D.steder[valgtSted], dag=st.dager[valgtDag];
  let h='';
  if(D.feil.length) h+=`<div class="feil"><b>⚠ Datakilder som feilet</b><br>${D.feil.map(esc).join('<br>')}</div>`;

  /* vind */
  h+='<div class="kort"><h2>🌬️ Vind</h2><div class="faner" role="tablist">';
  D.steder.forEach((s,i)=>h+=`<button class="fane" role="tab" aria-selected="${i===valgtSted}" onclick="velgSted(${i})">${esc(s.navn)}</button>`);
  h+='</div><div class="faner">';
  st.dager.forEach((d,i)=>h+=`<button class="fane" role="tab" aria-selected="${i===valgtDag}" onclick="velgDag(${i})">${esc(d.etikett)}</button>`);
  h+='</div>';
  if(dag){
    const tm=dag.timer, topp=tm.reduce((a,b)=>b.vind>a.vind?b:a), v=vindu(tm);
    h+=tegnGraf(tm);
    h+=`<div class="meta"><span>Topp <b>${topp.vind} m/s</b> ${esc(topp.retning)} kl ${topp.t}</span>
        <span>Kast <b>${Math.max(...tm.map(t=>t.kast)).toFixed(1)}</b></span>
        <span>Temp <b>${Math.min(...tm.map(t=>t.temp))}–${Math.max(...tm.map(t=>t.temp))}°C</b></span>
        <span>Nedbør <b>${tm.reduce((a,b)=>a+b.nedbor,0).toFixed(1)} mm</b></span></div>`;
    h+=v ? `<div class="vindu">✅ Wingfoil-vindu ${v[0].t}–${v[v.length-1].t+1} · ${(v.reduce((a,b)=>a+b.vind,0)/v.length).toFixed(1)} m/s ${esc(v[Math.floor(v.length/2)].retning)}</div>`
         : `<div class="vindu ingen">Ingen sammenhengende vind over ${D.terskel} m/s denne dagen.</div>`;
  }
  h+='</div>';

  /* badetemperatur */
  h+='<div class="kort"><h2>🏊 Badetemperatur</h2>';
  D.steder.forEach(s=>{ if(s.bad.length){ h+=`<div class="seksjon">${esc(s.navn)}</div>`;
    s.bad.forEach(b=>h+=`<div class="rad"><span>${esc(b.navn)}</span>
      <span><b>${b.temp}°C</b> <span class="badge">${b.alder_t<=6?'fersk':b.alder_t+' t'} · ${b.km} km</span></span></div>`);}});
  h+='</div>';

  /* kalender */
  if(D.kalender.length){
    h+='<div class="kort"><h2>📅 Kalender</h2>';
    D.kalender.forEach(e=>h+=`<div class="rad"><span>${esc(e.navn)}</span>
      <span class="badge">${e.i_dag?'i dag':esc(e.dato)} ${esc(e.når)}</span></div>`);
    h+='</div>';
  }

  /* oppfølging */
  if(D.oppfolging.length){
    h+='<div class="kort"><h2>📋 Oppfølging</h2>';
    D.oppfolging.forEach(t=>h+=`<div class="sak p${t.pri}"><b>${t.tekst}</b>${t.beskrivelse?`<p>${t.beskrivelse}</p>`:''}</div>`);
    h+='</div>';
  }

  /* handleliste */
  const sek=Object.keys(D.handleliste);
  if(sek.length){
    h+='<div class="kort"><h2>🛒 Handleliste</h2>';
    /* Rekkefølgen kommer fra SEKSJONSREKKEFØLGE i morgenbrief.py — hardkodet
       her tidligere med feil strektegn, som gjorde at seksjoner falt stille ut. */
    D.seksjonsrekkefolge.forEach(n=>{
      if(!D.handleliste[n]) return;
      h+=`<div class="seksjon">${esc(n)}</div>`;
      D.handleliste[n].forEach(v=>{
        const av=localStorage.getItem('v:'+v.id)==='1';
        h+=`<label class="vare${av?' av':''}"><input type="checkbox" ${av?'checked':''}
            onchange="kryss('${v.id}',this)"><span>${esc(v.tekst)}</span></label>`;});
    });
    h+='<div class="notis">Avkryssing lagres kun her i nettleseren — Todoist oppdateres ikke.</div></div>';
  }

  /* arrangementer */
  if(D.arrangementer.length){
    h+='<div class="kort"><h2>🎪 Hva skjer i Horten</h2>';
    let f=null;
    D.arrangementer.forEach(e=>{
      if(e.dag!==f){f=e.dag;h+=`<div class="dagbolk${e.dag===0?' naa':''}">${esc(e.etikett)}</div>`;}
      const d=e.tekst.split(':'), sted=d.length>1?d.shift():'';
      h+=`<div class="rad"><span>${sted?`<b>${esc(sted)}</b> — `:''}${esc(d.join(':').trim())}</span></div>`;});
    h+='</div>';
  }

  /* nyheter */
  if((D.nyheter.saker||[]).length){
    h+='<div class="kort"><h2>📰 Lokalt</h2>';
    if(!D.nyheter.fersk) h+=`<div class="notis">Dagens digest har ikke kjørt — saker fra ${esc(D.nyheter.dato)}.</div>`;
    D.nyheter.saker.forEach(s=>h+=`<div class="rad"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.tittel)}</a></div>`);
    h+='</div>';
  }

  /* barn-wiki — fellessiden med lekser, ukeplan og beskjeder */
  h+=`<div class="kort"><h2>👦 Barna</h2>
      <a class="knapp" href="https://nettopp.github.io/barn-wiki/" target="_blank" rel="noopener">
      Åpne barn-wiki — lekser, ukeplan og beskjeder</a></div>`;

  document.getElementById('innhold').innerHTML=h;
}
function velgSted(i){valgtSted=i;valgtDag=0;tegn();}
function velgDag(i){valgtDag=i;tegn();}
function kryss(id,el){localStorage.setItem('v:'+id,el.checked?'1':'0');el.closest('label').classList.toggle('av',el.checked);}
tegn();
</script>
